<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="keyTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6" />
      <stop offset="10%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Keycap Base with Shadow -->
  <rect x="12" y="10" width="104" height="104" rx="26" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Top Key Surface Highlight -->
  <rect x="15" y="13" width="98" height="98" rx="23" fill="none" stroke="url(#keyTop)" stroke-width="2.5" />
  
  <!-- Ethiopic 'እ' Glyph -->
  <text x="64" y="80" 
        font-family="system-ui, -apple-system, 'Noto Sans Ethiopic', 'Segoe UI', 'Nyala', sans-serif" 
        font-size="62" 
        font-weight="bold" 
        text-anchor="middle"
        fill="#FFFFFF">እ</text>

  <!-- Keyboard bottom accent dots -->
  <circle cx="50" cy="99" r="2.5" fill="#93C5FD" opacity="0.8" />
  <circle cx="64" cy="99" r="2.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="78" cy="99" r="2.5" fill="#93C5FD" opacity="0.8" />
</svg>
