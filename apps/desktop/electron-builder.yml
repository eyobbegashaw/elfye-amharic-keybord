appId: com.elfye.desktop
productName: Elfye Amharic Keyboard
copyright: Copyright © 2026 Elfye Team

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - package.json

# Linux configuration
linux:
  target:
    - AppImage
    - deb
  icon: public/icon.png
  category: Utility
  synopsis: Elfye Amharic Phonetic Keyboard & Native IME Manager
  description: System-wide Amharic Phonetic Keyboard manager and practice tool for Linux (IBus).
  extraResources:
    - from: ../desktop-ime/linux/ibus-amharic
      to: desktop-ime/linux/ibus-amharic
      filter:
        - "**/*"
        - "!build/test_vectors"

# macOS configuration (requires Apple Developer ID & notarization for distribution)
mac:
  target:
    - dmg
    - zip
  icon: public/icon.png
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  extraResources:
    - from: ../desktop-ime/macos
      to: desktop-ime/macos
      filter:
        - "**/*"
        - "!.build/**"

# Windows configuration
win:
  target:
    - nsis
    - portable
  icon: public/icon.png
  publisherName: Elfye Team
  verifyUpdateCodeSignature: false
  extraResources:
    - from: ../desktop-ime/windows/bin
      to: desktop-ime/windows/bin
      filter:
        - "x64/AmharicTSF64.dll"
        - "x86/AmharicTSF32.dll"
    - from: ../desktop-ime/windows/scripts
      to: desktop-ime/windows/scripts
      filter:
        - "*.ps1"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  include: build/installer.nsh
