name: Bug Report
description: Report an issue or unexpected behavior in Elfye Keyboard
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Affected Platform
      options:
        - "Android"
        - "iOS"
        - "Windows"
        - "macOS"
        - "Linux"
        - "Web"
    validations:
      required: true
