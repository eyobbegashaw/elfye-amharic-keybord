name: Feature Request
description: Propose a new capability or improvement for Elfye Keyboard
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: What capability would you like to see?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Motivation & Use Cases
      description: Why is this feature needed?
