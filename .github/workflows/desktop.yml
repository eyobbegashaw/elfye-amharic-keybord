name: Desktop Build & Release

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/desktop-ime/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: elfye-desktop-windows
            files: |
              apps/desktop/release/*.exe
          - os: macos-latest
            platform: mac
            artifact: elfye-desktop-macos
            files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - os: ubuntu-latest
            platform: linux
            artifact: elfye-desktop-linux
            files: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows TSF DLLs
        if: matrix.platform == 'win'
        shell: cmd
        run: call apps\desktop-ime\windows\build.bat

      - name: Build macOS InputMethodKit bundle
        if: matrix.platform == 'mac'
        run: |
          cd apps/desktop-ime/macos
          ./build.sh

      - name: Install Linux IBus dependencies & build ibus-engine-amharic
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev libglib2.0-dev
          make -C apps/desktop-ime/linux/ibus-amharic all test

      - name: Build workspace packages & desktop app
        run: |
          pnpm --filter @elfye/core build
          pnpm --filter @elfye/react build
          pnpm --filter desktop build

      - name: Package Desktop Installer (${{ matrix.platform }})
        working-directory: apps/desktop
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload Desktop Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release-desktop:
    name: Attach Desktop Installers to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Upload Desktop Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/elfye-desktop-windows/*.exe
            release-assets/elfye-desktop-macos/*.dmg
            release-assets/elfye-desktop-macos/*.zip
            release-assets/elfye-desktop-linux/*.AppImage
            release-assets/elfye-desktop-linux/*.deb
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
