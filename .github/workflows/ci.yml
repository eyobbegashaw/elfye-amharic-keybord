name: CI & Cross-Platform Parity

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-check:
    name: TypeScript Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Turbo Tasks (Build, Typecheck, Test, Lint)
        run: pnpm turbo run build typecheck test lint

  parity:
    name: Parity Verification (${{ matrix.platform.name }})
    needs: ts-check
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: 'TypeScript Core'
            os: ubuntu-latest
            type: ts
          - name: 'C Engine (Linux)'
            os: ubuntu-latest
            type: c
          - name: 'Swift Core (macOS/iOS)'
            os: macos-latest
            type: swift
          - name: 'Java Engine (Android)'
            os: ubuntu-latest
            type: java
          - name: 'C++ TSF (Windows)'
            os: windows-latest
            type: cpp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. TypeScript port test
      - name: Test TypeScript Core Against Vectors
        if: matrix.platform.type == 'ts'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @elfye/core test

      # 2. C port test
      - name: Test C Core Against Vectors
        if: matrix.platform.type == 'c'
        run: |
          cd apps/desktop-ime/linux/ibus-amharic/core
          gcc -std=c11 -Wall -Wextra -O2 amharic_core.c test_vectors.c -o test_runner
          ./test_runner ../../../../../test-vectors.json

      # 3. Swift port test
      - name: Test Swift Core Against Vectors
        if: matrix.platform.type == 'swift'
        run: |
          swift test --package-path apps/ios/AmharicCore

      # 4. Java port test
      - name: Setup Java JDK 17
        if: matrix.platform.type == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Test Java Core Against Vectors
        if: matrix.platform.type == 'java'
        run: |
          cd apps/android
          ./gradlew testDebugUnitTest --continue

      # 5. C++ Windows port test
      - name: Setup MSVC Developer Command Prompt
        if: matrix.platform.type == 'cpp'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Test C++ Windows Core Against Vectors
        if: matrix.platform.type == 'cpp'
        shell: cmd
        run: |
          cd apps\desktop-ime\windows\core
          cl /nologo /std:c++17 /EHsc /utf-8 /Fe:test_runner.exe AmharicCore.cpp TestVectors.cpp
          test_runner.exe ..\..\..\..\test-vectors.json
