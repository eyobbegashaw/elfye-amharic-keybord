name: Android Build & Release

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elfye-keyboard-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release-build:
    name: Build & Sign Release APK + AAB
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Release APK & Bundle (AAB)
        working-directory: apps/android
        run: ./gradlew assembleRelease bundleRelease

      - name: Sign Release Artifacts (if keystore secret present)
        if: env.KEYSTORE_PRESENT == 'true'
        env:
          KEYSTORE_PRESENT: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > apps/android/release.keystore
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore apps/android/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            apps/android/app/build/outputs/bundle/release/*.aab "$KEY_ALIAS"
          for apk in apps/android/app/build/outputs/apk/release/*.apk; do
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore apps/android/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$apk" "$KEY_ALIAS"
          done

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elfye-keyboard-release-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elfye-keyboard-release-aab
          path: apps/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  release-android:
    name: Attach Android Artifacts to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-debug, release-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Upload Android Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/elfye-keyboard-debug-apk/*.apk
            release-assets/elfye-keyboard-release-apk/*.apk
            release-assets/elfye-keyboard-release-aab/*.aab
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
